name: Keep SoundForge Awake

on:
  schedule:
    # Run every 15 minutes, between 04:00 and 16:59 UTC (9:30 AM to 10:29 PM IST)
    - cron: '*/15 4-16 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -s https://soundforge-api.onrender.com/health
